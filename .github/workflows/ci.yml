name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  server-ci:
    name: Server Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: xangoes_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xangoes_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/xangoes_test_db
      RATE_LIMIT: 100
      RATE_LIMIT_WINDOW: 60
      NODE_ENV: test
      GOOGLE_CLIENT_ID: ci_test_client_id
      GOOGLE_CLIENT_SECRET: ci_test_client_secret
      GOOGLE_REDIRECT_URI: http://localhost:5000/auth/google/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Check Drizzle Migrations
        working-directory: server
        run: npx drizzle-kit migrate

      - name: Run Tests
        working-directory: server
        run: npm test

  client-ci:
    name: Client Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Run Client Lint & Typecheck
        working-directory: client
        run: |
          npm run lint --if-present
          npx tsc --noEmit

